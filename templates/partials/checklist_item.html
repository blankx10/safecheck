<label class="flex gap-3 items-start p-3 rounded-xl hover:bg-slate-50">
  <input type="checkbox" class="mt-1" {% if item.completed %}checked{% endif %} aria-label="{{ item.title }}">
  <span>
    <span class="font-medium">{{ item.title }}</span>
    <span class="ml-2 text-xs px-2 py-0.5 rounded {% if item.priority == '高' %}bg-red-100 text-red-800{% elif item.priority == '中' %}bg-yellow-100 text-yellow-800{% else %}bg-green-100 text-green-800{% endif %}">{{ item.priority }}</span>
    <span class="block text-sm text-slate-600">{{ item.description }}</span>
  </span>
</label>
