{% extends "base.html" %}
{% block title %}反馈 - 安心查{% endblock %}
{% block content %}
<section class="space-y-6 max-w-xl">
  <h1 class="text-2xl font-bold">使用反馈</h1>
  <form id="feedback-form" class="bg-white rounded-2xl p-5 shadow space-y-3">
    <label class="block font-medium" for="rating">评分（1–5）</label>
    <select id="rating" name="rating" class="border rounded-xl p-2 w-full" required>
      <option value="5">5 很有帮助</option>
      <option value="4">4</option>
      <option value="3">3</option>
      <option value="2">2</option>
      <option value="1">1 需要改进</option>
    </select>
    <label class="block font-medium" for="comment">评论（可选，最多 500 字）</label>
    <textarea id="comment" maxlength="500" rows="4" class="w-full border rounded-xl p-3" placeholder="请不要填写密码、验证码或身份证号"></textarea>
    <p id="feedback-error" class="text-red-700 text-sm hidden" role="alert"></p>
    <button type="submit" class="bg-blue-700 text-white rounded-xl px-5 py-2 hover:bg-blue-800">提交</button>
  </form>
  <p id="feedback-thanks" class="hidden text-green-700 bg-green-50 rounded-xl p-4">谢谢你的反馈。我们不会把评论用于识别个人身份。</p>
</section>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("feedback-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var err = document.getElementById("feedback-error");
    err.classList.add("hidden");
    var response = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: window.safecheckSessionId,
        rating: Number(document.getElementById("rating").value),
        comment: document.getElementById("comment").value
      })
    });
    var data = await response.json();
    if (!response.ok) {
      err.textContent = data.error || "提交失败，请稍后再试。";
      err.classList.remove("hidden");
      return;
    }
    document.getElementById("feedback-thanks").classList.remove("hidden");
  });
</script>
{% endblock %}
