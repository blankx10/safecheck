<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}安心查 SafeCheck{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="text-lg font-semibold text-blue-700">安心查 SafeCheck</a>
      <nav class="flex flex-wrap gap-3 text-sm" aria-label="主导航">
        <a class="hover:text-blue-700" href="/">首页</a>
        <a class="hover:text-blue-700" href="/scam">可疑信息自查</a>
        <a class="hover:text-blue-700" href="/password">密码自查</a>
        <a class="hover:text-blue-700" href="/checklist">加固清单</a>
        <a class="hover:text-blue-700" href="/quiz">防诈骗测试</a>
        <a class="hover:text-blue-700" href="/stats">统计</a>
        <a class="hover:text-blue-700" href="/about">关于</a>
      </nav>
      <button type="button" class="text-xs border rounded px-2 py-1 text-slate-500" aria-label="语言切换占位，暂仅提供中文">中文</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t bg-white mt-8">
    <div class="max-w-5xl mx-auto px-4 py-6 text-sm text-slate-600 space-y-2">
      <p>本网站不存储密码，不保存可疑信息原文。结果仅供参考，不构成法律或安全保证。</p>
      <p>
        <a class="text-blue-700 underline" href="/privacy">隐私政策</a>
        ·
        <a class="text-blue-700 underline" href="/feedback">反馈</a>
        ·
        <a class="text-blue-700 underline" href="/about">关于</a>
      </p>
    </div>
  </footer>
  <script>
    (function () {
      var key = "safecheck_session_id";
      var id = localStorage.getItem(key);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(key, id);
      }
      window.safecheckSessionId = id;
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
