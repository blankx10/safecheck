{% extends "base.html" %}
{% block title %}防诈骗情景测试 - 安心查{% endblock %}
{% block content %}
<section class="space-y-6 max-w-3xl">
  <h1 class="text-2xl font-bold">防诈骗情景小测试</h1>
  <p class="text-slate-600">共 20 题。每题选完会立刻看到解释。用于学习，不是考试。</p>
  <div id="quiz-root" class="bg-white rounded-2xl p-5 shadow"></div>
  <div id="quiz-result" class="hidden"></div>
  <button type="button" id="quiz-restart" class="hidden border rounded-xl px-4 py-2 hover:bg-slate-100">重新开始</button>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
